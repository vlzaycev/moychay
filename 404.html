<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">

<style>
@font-face{font-family:'Space Grotesk';font-weight:500 700;font-display:swap;src:url(/fonts/space-grotesk-latin.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Inter';font-weight:300 600;font-display:swap;src:url(/fonts/inter-latin.woff2) format('woff2');unicode-range:U+0000-00FF}
@font-face{font-family:'Inter';font-weight:300 600;font-display:swap;src:url(/fonts/inter-cyrillic.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{--dark:#2A2826;--on-dark:#F4F0E8;--muted:rgba(244,240,232,.68);--clay:#B5602F;--btn:#A4552A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--dark);color:var(--on-dark);
  font:17px/1.6 Inter,system-ui,sans-serif;padding:24px;text-align:center}
img{height:72px;width:auto;margin:0 auto 40px;display:block}
h1{font-family:"Space Grotesk",Inter,sans-serif;font-weight:600;font-size:clamp(36px,8vw,64px);line-height:1.05;margin:0 0 16px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--clay)}
p{color:var(--muted);margin:0 0 32px}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;background:var(--btn);color:#fff;text-decoration:none;font-weight:600;border-radius:2px}
a.btn.ghost{background:none;border:1px solid rgba(244,240,232,.3)}
a.btn:hover{filter:brightness(.92)}
</style>
</head>
<body>
<main>
  <img src="/img/logo.png" width="800" height="494" alt="Moychay Phuket">
  <h1>Page not <em>found</em></h1>
  <p>This page doesn't exist. Страница не найдена.</p>
  <div class="links">
    <a class="btn" href="/">Go to homepage</a>
    <a class="btn ghost" href="/ru/" lang="ru">На главную (RU)</a>
  </div>
</main>
</body>
</html>
